name: Update app versions

# Keeps ToonRepo.xml on `main` in sync with each app's latest version.txt.
# Only ever runs against `main` and only ever touches ToonRepo.xml there -
# the `test` and `dev` branches are maintained by hand and are not part
# of this workflow's checkout or trigger.
# Changes go to one pull request from the branch auto/update-app-versions:
# while that pull request is open, later runs update it instead of opening
# another one.

on:
  schedule:
    # Daily at 05:17 UTC (off the hour to avoid the GitHub Actions rush).
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run version check
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES_SUMMARY_FILE: ${{ runner.temp }}/changes.txt
        run: |
          python3 scripts/update_versions.py
          if [ -s "$CHANGES_SUMMARY_FILE" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.update.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/update-app-versions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ToonRepo.xml
          git commit -m "Update app versions in ToonRepo.xml"
          # replaces what an earlier run left on the branch
          git push --force origin "$BRANCH"

          BODY_FILE="${{ runner.temp }}/pr_body.txt"
          {
            echo "Automated version sync for \`main\`'s ToonRepo.xml. \`test\` and \`dev\` are unaffected and still maintained by hand."
            echo
            echo "Changes:"
            cat "${{ runner.temp }}/changes.txt"
          } > "$BODY_FILE"

          OPEN=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --body-file "$BODY_FILE"
            echo "Updated pull request #$OPEN"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update app versions in ToonRepo.xml" \
              --body-file "$BODY_FILE"
          fi
