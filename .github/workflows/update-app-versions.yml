name: Update app versions

# Keeps ToonRepo.xml on `main` in sync with each app's latest version.txt.
# Only ever runs against `main` and only ever touches ToonRepo.xml there -
# the `test` and `dev` branches are maintained by hand and are not part
# of this workflow's checkout or trigger.

on:
  schedule:
    # Daily at 05:17 UTC (off the hour to avoid the GitHub Actions rush).
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run version check
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES_SUMMARY_FILE: ${{ runner.temp }}/changes.txt
        run: |
          python3 scripts/update_versions.py
          if [ -s "$CHANGES_SUMMARY_FILE" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.update.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/update-app-versions-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ToonRepo.xml
          git commit -m "Update app versions in ToonRepo.xml"
          git push origin "$BRANCH"

          BODY_FILE="${{ runner.temp }}/pr_body.txt"
          {
            echo "Automated version sync for \`main\`'s ToonRepo.xml. \`test\` and \`dev\` are unaffected and still maintained by hand."
            echo
            echo "Changes:"
            cat "${{ runner.temp }}/changes.txt"
          } > "$BODY_FILE"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update app versions in ToonRepo.xml" \
            --body-file "$BODY_FILE"
